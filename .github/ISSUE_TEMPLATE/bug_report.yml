name: Bug Report
description: Report a reproducible problem with Artemis' Thin Logs
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem with Artemis' Thin Logs.

        Please provide enough information for the issue to be reproduced and investigated.

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: Which Minecraft version are you using?
      placeholder: "Example: 1.21.1"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Thin Logs Version
      description: Which version of Thin Logs are you using?
      placeholder: "Example: 0.3r"
    validations:
      required: true

  - type: input
    id: loader
    attributes:
      label: Mod Loader
      description: Which mod loader and version are you using?
      placeholder: "Example: NeoForge 21.1.226"
    validations:
      required: true

  - type: input
    id: affected-block
    attributes:
      label: Affected Block or Wood Type
      description: Which thin log, stem, bamboo variant, wood type, or related block is affected? Enter N/A if the issue is not specific to one.
      placeholder: "Example: Thin Oak Log"
    validations:
      required: true

  - type: dropdown
    id: world-generation
    attributes:
      label: Does the Issue Involve World Generation?
      description: Does the problem involve naturally generated thin trees, fungi, or other Thin Logs world generation?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: Explain what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Explain what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide clear steps that can be used to reproduce the issue.
      placeholder: |
        1. Launch the game with ...
        2. Place/use or locate ...
        3. ...
        4. The issue occurs.
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other Installed Mods
      description: List other mods that may be relevant. If the issue may be compatibility-related, provide the full mod list if possible.
      placeholder: |
        Example:
        - JEI 19.22.0.315
        - Example Mod 1.2.3

  - type: textarea
    id: logs
    attributes:
      label: Logs / Crash Report
      description: Attach or paste relevant logs or crash reports. Use a file attachment or code block for long logs.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add screenshots, videos, world information, biome information, seeds, coordinates, or anything else that may help.

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true
        - label: I am using a Thin Logs version intended for my Minecraft version.
          required: true
        - label: I am using compatible versions of the required dependencies.
          required: true
        - label: I can reproduce this issue.
          required: true